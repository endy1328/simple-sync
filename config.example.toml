interval_seconds = 10
skin = "syncback_blue"
window_width = 1720
window_height = 1120

[[pairs]]
name = "Main Backup"
enabled = true
mode = "copy"
source = "C:\\source"
target = "D:\\backup"
extensions = [".md", ".pdf"]
files = ["README.md", "docs/setup.md"]
include = ["docs/**"]
exclude = ["bin/**", "obj/**", ".git/**", "*.tmp"]
include_subdirectories = true

[[pairs]]
name = "Secondary Backup"
enabled = false
mode = "mirror"
source = "C:\\another-source"
target = "D:\\another-backup"
