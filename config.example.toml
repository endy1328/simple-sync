interval_seconds = 10
skin = "syncback_blue"
language = "ko-KR"
window_width = 1720
window_height = 1120

[[filter_presets]]
name = "Documents"
extensions = [".docx", ".xlsx", ".pdf", ".txt", ".md"]

[[filter_presets]]
name = "Images"
extensions = [".png", ".jpg", ".svg"]

[[filter_presets]]
name = "Code"
extensions = [".cs", ".js", ".json", ".xml", ".md"]

[[filter_presets]]
name = "Archives"
extensions = [".zip", ".7z", ".tar"]

[[filter_presets]]
name = "Exclude temp/build"
exclude = ["*.tmp", ".git/**", "bin/**", "obj/**", "node_modules/**"]

[[pairs]]
name = "Main Backup"
enabled = true
mode = "copy"
source = "C:\\source"
target = "D:\\backup"
extensions = [".md", ".pdf"]
files = ["README.md", "docs/setup.md"]
include = ["docs/**"]
exclude = ["bin/**", "obj/**", ".git/**", "*.tmp"]
include_subdirectories = true

[[pairs]]
name = "Secondary Backup"
enabled = false
mode = "mirror"
source = "C:\\another-source"
target = "D:\\another-backup"

# Google Drive examples: import OAuth settings and connect accounts in the app first.
# Select folders through Connection settings; use the account's stable reference ID.
[[pairs]]
name = "PC to My Drive"
enabled = false
mode = "copy"
source_type = "local"
target_type = "google_drive"
source = "C:\\source"
target = "DRIVE_FOLDER_ID"
target_label = "My Drive/Backup"
drive_account_id = "CONNECTED_ACCOUNT_ID"

[[pairs]]
name = "My Drive to PC"
enabled = false
mode = "copy"
source_type = "google_drive"
target_type = "local"
source = "DRIVE_FOLDER_ID"
source_label = "My Drive/Documents"
target = "D:\\drive-downloads"
drive_account_id = "CONNECTED_ACCOUNT_ID"
